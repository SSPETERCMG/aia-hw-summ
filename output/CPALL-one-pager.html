<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPALL สรุป 1 หน้า</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--paper:#fffdf8;--ink:#1d2a2e;--mute:#5d6b6f;--line:#e3dccb;--green:#2e8b57;--amber:#e0a21b;--red:#c8453b;--accent:#0f4c5c;--accent2:#e36414}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:"Sarabun","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;color:var(--ink);line-height:1.35;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:210mm;height:297mm;margin:8mm auto;background:var(--paper);padding:12mm 13mm 9mm;overflow:hidden;display:flex;flex-direction:column;gap:5.5mm;box-shadow:0 2px 14px rgba(0,0,0,.12)}
@page{size:A4;margin:0}
@media print{body{background:none}.page{margin:0;box-shadow:none}}
@media (max-width:820px){.page{width:100%;height:auto;margin:0;padding:16px}}
h2{font-size:12.5pt;font-weight:800;color:var(--accent);margin-bottom:2.2mm}
h2 span{font-weight:600;font-size:9.5pt;color:var(--mute);margin-left:1.5mm}
.ref{font-size:6.5pt;color:#9aa5a8;font-weight:400;white-space:nowrap}
/* หัว */
.head{border-bottom:2px solid var(--accent);padding-bottom:3.5mm}
.tk{font-size:10pt;font-weight:800;color:var(--accent2);letter-spacing:1.2px}
.head h1{font-size:23pt;font-weight:800;line-height:1.15;margin-top:1mm}
.head p{font-size:10.5pt;color:var(--mute);margin-top:1mm}
/* ตัวเลขใหญ่ */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm}
.stat{background:var(--accent);color:#fff;border-radius:3mm;padding:3.4mm 4mm}
.stat b{display:block;font-size:22pt;font-weight:800;line-height:1.05}
.stat span{font-size:10pt;opacity:.95}
.stat .ref{color:#cfe0e4}
/* แถบ */
.barrow{display:grid;grid-template-columns:24mm 1fr;align-items:center;gap:3mm;margin-bottom:2mm}
.barrow .lab{font-size:10.5pt;font-weight:700}
.bar{display:flex;height:9mm;border-radius:2mm;overflow:hidden;font-size:11pt;font-weight:800;color:#fff}
.bar i{display:flex;align-items:center;justify-content:center;font-style:normal}
.c1{background:var(--accent2)}.c2{background:var(--accent)}.c3{background:#8a9598}
.legend{display:flex;gap:5mm;font-size:9.5pt;margin-left:27mm}
.legend span::before{content:"";display:inline-block;width:3mm;height:3mm;border-radius:50%;margin-right:1.4mm;vertical-align:-.3mm}
.l1::before{background:var(--accent2)}.l2::before{background:var(--accent)}.l3::before{background:#8a9598}
.takeaway{margin-top:2.4mm;font-size:11pt;font-weight:700;background:#fdeede;border-radius:2.5mm;padding:2.2mm 3.4mm}
/* ไฟ */
.lights{display:grid;grid-template-columns:repeat(4,1fr);gap:3.4mm}
.light{border:1.5px solid var(--line);border-radius:3mm;padding:3mm;background:#fff;text-align:center}
.dot{width:7mm;height:7mm;border-radius:50%;margin:0 auto 1.6mm;box-shadow:inset 0 -1px 2px rgba(0,0,0,.25)}
.g{background:var(--green)}.y{background:var(--amber)}.r{background:var(--red)}
.light h3{font-size:11pt;font-weight:800}
.light .big{font-size:19pt;font-weight:800;line-height:1.1;margin:1mm 0;color:var(--accent)}
.light p{font-size:9.5pt;color:var(--mute);line-height:1.3}
/* สองคอลัมน์ */
.two{display:grid;grid-template-columns:1fr 1fr;gap:5mm}
.box{border:1.5px solid var(--line);border-radius:3mm;padding:3.4mm 4mm;background:#fff}
.risk{display:flex;gap:2.6mm;align-items:flex-start;margin-bottom:2.6mm}
.risk:last-child{margin-bottom:0}
.risk em{flex:none;width:6.5mm;height:6.5mm;border-radius:50%;background:var(--red);color:#fff;font-style:normal;font-weight:800;font-size:10pt;display:flex;align-items:center;justify-content:center}
.risk b{display:block;font-size:11pt}
.risk span{font-size:9.8pt;color:var(--mute)}
.gauge{position:relative;height:3.2mm;border-radius:2mm;background:linear-gradient(90deg,#cfe6d8,#f1e3b6,#efc3bd);margin:8mm 0 1.4mm}
.gauge i{position:absolute;top:-1.8mm;width:1.2mm;height:7mm;background:var(--ink);border-radius:1mm}
.gauge u{position:absolute;top:-7mm;transform:translateX(-50%);font-size:12pt;font-weight:800;text-decoration:none;white-space:nowrap}
.gl{display:flex;justify-content:space-between;font-size:8.8pt;color:var(--mute)}
.price .pe{font-size:10.5pt;margin-top:2.4mm}
.price .pe b{font-size:13pt}
.price .cav{font-size:9.5pt;color:var(--mute);margin-top:1.2mm}
/* ศัพท์ */
.gloss{display:grid;grid-template-columns:repeat(4,1fr);gap:3mm}
.gloss div{background:#faf6ea;border-radius:2.5mm;padding:2.4mm 3mm;font-size:9.3pt}
.gloss b{display:block;font-size:10.5pt;color:var(--accent)}
.howto{background:#eef4f5;border-radius:2.6mm;padding:2.4mm 3.4mm;font-size:9pt;color:var(--ink);line-height:1.5}
.howto b{color:var(--accent)}
.foot{margin-top:auto;border-top:1px solid var(--line);padding-top:2mm;font-size:7.4pt;color:var(--mute);line-height:1.45}
.foot b{color:var(--ink)}
</style>
</head>
<body>
<main class="page" id="page"></main>

<script>
/* ===== DATA: เปลี่ยนหุ้นใหม่ = แก้เฉพาะก้อนนี้ (เลข [ ] = แถวใน data.csv) ===== */
const D = {
  ticker:"CPALL · ซีพี ออลล์",
  headline:"เจ้าของร้าน 7-Eleven ในไทย",
  sub:"ขายของใช้ประจำวัน ลูกค้ากลับมาซื้อทุกวัน",
  stats:[
    {v:"16,284 ร้าน", l:"7-Eleven ทั่วประเทศ", r:"114"},
    {v:"~1 ล้านล้านบาท", l:"รายได้ปี 2568", r:"40"},
    {v:"2.8 หมื่นล้านบาท", l:"กำไรสุทธิปี 2568", r:"50"}
  ],
  revenue:[{p:46,c:"c1"},{p:48,c:"c2"},{p:6,c:"c3"}],
  profit: [{p:61,c:"c1"},{p:28,c:"c2"},{p:11,c:"c3"}],
  legend:["ร้านสะดวกซื้อ","ค้าส่ง · ห้างค้าปลีก · ศูนย์การค้า","อื่น ๆ"],
  takeaway:"ร้านสะดวกซื้อขายได้ 46% แต่ทำกำไรถึง 61% คือหัวใจของบริษัท",
  takeRef:"108",
  lights:[
    {c:"g", n:"ทำกำไร", b:"+11%", t:"กำไรสุทธิเพิ่มจากปีก่อน", r:"50,51"},
    {c:"g", n:"เงินสด", b:"2.3 เท่า", t:"เงินสดที่เข้ามา เทียบกับกำไร", r:"83"},
    {c:"y", n:"หนี้", b:"3.2 แสนล้านบาท", t:"หนี้ที่มีดอกเบี้ย ยังไม่เกินเพดานในสัญญา", r:"22,145"},
    {c:"g", n:"ปันผล", b:"3.8%", t:"ต่อปี เทียบราคาหุ้น จ่ายเพิ่มทุกปี", r:"139,148"}
  ],
  risks:[
    {h:"หนี้เยอะ ซื้อกิจการมาก", t:"ถ้ากิจการที่ซื้อมาไม่ทำกำไร กำไรบริษัทอาจลด", r:"29,143"},
    {h:"ร้านเดิมขายโตช้า", t:"ยอดขายสาขาเดิมโตแค่ +0.8% ไตรมาสล่าสุด", r:"119"}
  ],
  price:{close:43.75, lo:41.0, hi:54.5, pe:"14.1", r:"148,150",
    cav:"ถูกหรือแพง ยังสรุปไม่ได้ เพราะยังไม่เทียบกับหุ้นตัวอื่น"},
  gloss:[
    {k:"ปันผล", v:"กำไรที่บริษัทแบ่งคืนเป็นเงินสด"},
    {k:"P/E", v:"ราคาหุ้น ÷ กำไรต่อหุ้น ยิ่งน้อยยิ่งจ่ายแพงน้อยกว่า"},
    {k:"เงินสดจากธุรกิจ", v:"เงินที่เข้ากระเป๋าจริงจากการขายของ"},
    {k:"ยอดขายสาขาเดิม", v:"ยอดขายร้านเก่า วัดว่าโตจริงไหม"}
  ],
  foot:"<b>ข้อมูล ณ 31 ต.ค. 2569</b> จากงบการเงินปี 2568 (ตรวจสอบ) · งบไตรมาส 2/2569 (สอบทาน) · MD&amp;A · แบบ 56-1 · ราคาจาก Yahoo Finance (ยังไม่ยืนยันกับ set.or.th) · สีไฟเป็นความเห็นผู้จัดทำ · <b>ไม่ใช่คำแนะนำการลงทุน</b> สรุปเพื่อการเรียนรู้เท่านั้น"
};

/* ===== TEMPLATE ===== */
const R = r => `<span class="ref">[${r}]</span>`;
const bar = arr => `<div class="bar">${arr.map(x=>`<i class="${x.c}" style="width:${x.p}%">${x.p}%</i>`).join("")}</div>`;
const pos = (D.price.close-D.price.lo)/(D.price.hi-D.price.lo)*100;
document.getElementById("page").innerHTML = `
<header class="head">
  <div class="tk">${D.ticker}</div>
  <h1>${D.headline}</h1>
  <p>${D.sub}</p>
</header>

<section class="stats">${D.stats.map(s=>`<div class="stat"><b>${s.v}</b><span>${s.l} ${R(s.r)}</span></div>`).join("")}</section>

<section>
  <h2>เงินมาจากไหน<span>ปี 2568</span></h2>
  <div class="barrow"><div class="lab">ยอดขาย</div>${bar(D.revenue)}</div>
  <div class="barrow"><div class="lab">กำไร</div>${bar(D.profit)}</div>
  <div class="legend"><span class="l1">${D.legend[0]}</span><span class="l2">${D.legend[1]}</span><span class="l3">${D.legend[2]}</span></div>
  <p class="takeaway">${D.takeaway} ${R(D.takeRef)}</p>
</section>

<section>
  <h2>สุขภาพบริษัท<span>เขียว = ดี · เหลือง = ระวัง</span></h2>
  <div class="lights">${D.lights.map(l=>`
    <div class="light"><div class="dot ${l.c}"></div><h3>${l.n}</h3><div class="big">${l.b}</div><p>${l.t} ${R(l.r)}</p></div>`).join("")}
  </div>
</section>

<section class="two">
  <div class="box"><h2>ความเสี่ยง</h2>
    ${D.risks.map((x,i)=>`<div class="risk"><em>${i+1}</em><div><b>${x.h}</b><span>${x.t} ${R(x.r)}</span></div></div>`).join("")}</div>
  <div class="box price"><h2>ราคาตอนนี้<span>บาท</span></h2>
    <div class="gauge"><i style="left:${pos}%"></i><u style="left:${pos}%">${D.price.close.toFixed(2)}</u></div>
    <div class="gl"><span>ต่ำสุด 1 ปี ${D.price.lo.toFixed(1)}</span><span>สูงสุด ${D.price.hi.toFixed(1)}</span></div>
    <p class="pe">P/E <b>${D.price.pe} เท่า</b> ${R(D.price.r)}</p>
    <p class="cav">${D.price.cav}</p></div>
</section>

<section>
  <h2>ศัพท์ที่ควรรู้</h2>
  <div class="gloss">${D.gloss.map(g=>`<div><b>${g.k}</b>${g.v}</div>`).join("")}</div>
</section>

<section class="howto"><b>วิธีอ่านเลขในหน้านี้</b> · <b>[40]</b> = เลขอ้างอิง ชี้ไปที่แถวที่มา (เอกสาร หน้า งวด) ในไฟล์ <i>output/data.csv</i> · เงินทุกจำนวนเป็น <b>บาท</b> · 1 หมื่นล้าน = 10,000 ล้าน · 1 แสนล้าน = 100,000 ล้าน · 1 ล้านล้าน = 1,000,000 ล้าน · % = เปรียบเทียบกับปีก่อน (ปี 2568 เทียบ 2567) เว้นแต่ระบุอื่น</section>
<footer class="foot">${D.foot}</footer>`;
if(location.hash==='#shot1'){var s=document.createElement('style');s.textContent='.page{margin:0!important;box-shadow:none!important;width:210mm!important;height:297mm!important;padding:12mm 13mm 9mm!important}body{background:#fff}';document.head.appendChild(s);}
</script>
</body>
</html>
