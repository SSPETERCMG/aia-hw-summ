<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPALL สรุป 1 หน้า</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea; --paper:#fffdf8; --ink:#1d2a2e; --mute:#5d6b6f; --line:#ddd6c6;
  --green:#2e8b57; --amber:#e0a21b; --red:#c8453b; --accent:#0f4c5c; --accent2:#e36414;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:"Sarabun","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;color:var(--ink);line-height:1.35;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:210mm;height:297mm;margin:8mm auto;background:var(--paper);padding:10mm 12mm 8mm;overflow:hidden;display:flex;flex-direction:column;gap:3.2mm;box-shadow:0 2px 14px rgba(0,0,0,.12)}
@page{size:A4;margin:0}
@media print{body{background:none}.page{margin:0;box-shadow:none}}
@media (max-width:820px){.page{width:100%;height:auto;margin:0;padding:16px}}
h2{font-size:10.5pt;font-weight:800;color:var(--accent);letter-spacing:.2px;margin-bottom:1.6mm}
.ref{font-size:7pt;color:var(--mute);font-weight:400;white-space:nowrap}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:6mm;border-bottom:2px solid var(--accent);padding-bottom:3mm}
.head .tk{font-size:8.5pt;font-weight:700;color:var(--accent2);letter-spacing:1px}
.head h1{font-size:17pt;font-weight:800;line-height:1.15;margin-top:.5mm}
.head .asof{font-size:7.5pt;color:var(--mute);text-align:right;max-width:44mm}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:3mm}
.stat{background:var(--accent);color:#fff;border-radius:2.5mm;padding:2.4mm 3mm}
.stat b{display:block;font-size:15pt;font-weight:800;line-height:1.1}
.stat span{font-size:8pt;opacity:.92}
.stat .ref{color:#cfe0e4}
.bars{display:grid;gap:1.8mm}
.barrow .lab{font-size:8.8pt;color:var(--mute);margin-bottom:.6mm}
.bar{display:flex;height:7mm;border-radius:1.5mm;overflow:hidden;font-size:8pt;font-weight:700;color:#fff}
.bar i{display:flex;align-items:center;justify-content:center;font-style:normal;white-space:nowrap}
.c1{background:var(--accent2)}.c2{background:var(--accent)}.c3{background:#8a9598}
.legend{display:flex;gap:4mm;font-size:8.8pt;margin-top:1mm;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:2.4mm;height:2.4mm;border-radius:50%;margin-right:1.2mm;vertical-align:-.2mm}
.legend .l1::before{background:var(--accent2)}.legend .l2::before{background:var(--accent)}.legend .l3::before{background:#8a9598}
.insight{font-size:9.4pt;margin-top:1.2mm}
.lights{display:grid;grid-template-columns:1fr 1fr;gap:2.6mm}
.light{display:flex;gap:2.4mm;border:1px solid var(--line);border-radius:2.5mm;padding:2.2mm 2.6mm;background:#fff}
.dot{flex:none;width:7mm;height:7mm;border-radius:50%;margin-top:.6mm;box-shadow:inset 0 -1px 2px rgba(0,0,0,.25)}
.g{background:var(--green)}.y{background:var(--amber)}.r{background:var(--red)}
.light h3{font-size:9.5pt;font-weight:800}
.light h3 em{font-style:normal;font-weight:600;font-size:8pt;color:var(--mute);margin-left:1mm}
.light p{font-size:9.3pt}
.two{display:grid;grid-template-columns:1fr 1fr;gap:4mm}
.box{border:1px solid var(--line);border-radius:2.5mm;padding:2.4mm 3mm;background:#fff}
.risk ol{padding-left:4.4mm;font-size:9.3pt}
.risk li{margin-bottom:1.3mm}
.risk li b{color:var(--red)}
.gauge{position:relative;height:2.6mm;border-radius:2mm;background:linear-gradient(90deg,#cfe6d8,#f1e3b6,#efc3bd);margin:5mm 0 1.2mm}
.gauge i{position:absolute;top:-1.6mm;width:1mm;height:5.8mm;background:var(--ink);border-radius:1mm}
.gauge u{position:absolute;top:-5mm;transform:translateX(-50%);font-size:8.5pt;font-weight:800;text-decoration:none}
.gl{display:flex;justify-content:space-between;font-size:7.5pt;color:var(--mute)}
.price p{font-size:9.3pt;margin-top:1.2mm}
.price .kv{display:grid;grid-template-columns:1fr 1fr;gap:.6mm 3mm;font-size:9.3pt;margin-top:1.6mm}
.price .kv b{font-weight:800}
.gloss{display:grid;grid-template-columns:repeat(5,1fr);gap:2mm}
.gloss div{background:#faf6ea;border-radius:2mm;padding:1.8mm 2.2mm;font-size:8.6pt}
.gloss b{display:block;font-size:9.3pt;color:var(--accent);margin-bottom:.4mm}
.foot{margin-top:auto;border-top:1px solid var(--line);padding-top:1.6mm;font-size:7.2pt;color:var(--mute);line-height:1.4}
.foot b{color:var(--ink)}
</style>
</head>
<body>
<main class="page" id="page"></main>

<script>
/* ===== DATA: เปลี่ยนหุ้นใหม่ = แก้เฉพาะก้อนนี้ (เลข [ ] = แถวใน data.csv) ===== */
const D = {
  ticker:"CPALL", company:"ซีพี ออลล์",
  asof:"ข้อมูล ณ 31 ต.ค. 2569 · งบล่าสุด: ไตรมาส 2/2569 (สอบทาน) และปี 2568 (ตรวจสอบ)",
  headline:"เจ้าของร้าน 7-Eleven ในไทย ขายของใช้ประจำวันให้ลูกค้าราว 959 คนต่อร้านต่อวัน",
  sub:"16,284 ร้านทั่วประเทศ (มิ.ย. 2569) และยังเป็นเจ้าของธุรกิจค้าส่งและห้างค้าปลีกด้วย",
  subRef:"114,120",
  stats:[
    {v:"~9.9 แสนล้านบาท", l:"รายได้ปี 2568 (ใกล้ 1 ล้านล้าน)", r:"40"},
    {v:"2.82 หมื่นล้านบาท", l:"กำไรสุทธิปี 2568 (โต +11%)", r:"50,51"},
    {v:"1.65 บาท/หุ้น", l:"ปันผลปี 2568 (ผลตอบแทน ~3.8%)", r:"139,148"}
  ],
  revenue:[{t:"ร้านสะดวกซื้อ",p:46,c:"c1"},{t:"ค้าส่ง · ห้างค้าปลีก · ศูนย์การค้า",p:48,c:"c2"},{t:"อื่น ๆ",p:6,c:"c3"}],
  profit: [{t:"ร้านสะดวกซื้อ",p:61,c:"c1"},{t:"ค้าส่ง · ห้าง · ศูนย์ฯ",p:28,c:"c2"},{t:"อื่น ๆ",p:11,c:"c3"}],
  insight:"<b>ข้อสังเกต:</b> ร้านสะดวกซื้อคิดเป็นแค่ 46% ของยอดขาย แต่ทำกำไรถึง 61% จึงเป็น “เครื่องทำเงินหลัก” ของบริษัท",
  insightRef:"108",
  lights:[
    {c:"g", n:"ทำกำไร", s:"ดี", t:"กำไรสุทธิ 28.2 พันล้านบาท เพิ่มจาก 25.3 พันล้านปีก่อน (+11% คำนวณ) และ 6 เดือนแรกปี 2569 เพิ่มอีก +16% (คำนวณ)", r:"50,51,73,74"},
    {c:"g", n:"เงินสด", s:"ดี", t:"เงินสดที่ธุรกิจสร้างได้ 74.3 พันล้าน เป็น 2.3 เท่าของกำไร (บางส่วนเพราะค่าเช่าถูกจัดไปอยู่อีกหมวด) หลังหักลงทุนและค่าเช่าแล้วเหลือ ~32.5 พันล้าน", r:"79,83,100"},
    {c:"y", n:"หนี้", s:"ระวัง", t:"หนี้ที่มีดอกเบี้ย ~3.2 แสนล้านบาท จ่ายดอกเบี้ยปีละ 14.9 พันล้าน แต่หนี้สุทธิต่อทุน 0.82 เท่า ยังต่ำกว่าเพดานในสัญญากู้ (2 เท่า)", r:"22,47,145"},
    {c:"g", n:"ปันผล", s:"ดี", t:"จ่ายเพิ่มขึ้นทุกปีใน 5 ปี (0.60 เป็น 1.65 บาท) เงินสดที่เหลือหลังลงทุนและค่าเช่า ~2.7 เท่า (คำนวณ) ของปันผลที่จ่ายผู้ถือหุ้นบริษัท จึงดูจ่ายไหว", r:"95,100,139"}
  ],
  risks:[
    {h:"หนี้ก้อนใหญ่ และสินทรัพย์ที่เกิดจากการซื้อกิจการ", t:"“ค่าความนิยม” 3.6 แสนล้านบาท เท่ากับ 37% (คำนวณ) ของสินทรัพย์ทั้งหมด ผู้สอบบัญชีระบุเป็นเรื่องสำคัญ ถ้าธุรกิจที่ซื้อมาทำกำไรไม่ได้ตามคาด อาจต้องตัดมูลค่าทิ้งและกำไรลด", r:"9,29,143"},
    {h:"ยอดขายร้านเดิมโตช้า", t:"ยอดขายสาขาเดิมไตรมาส 2/2569 โตแค่ +0.8% (ไตรมาส 3/2568 ติดลบ −0.5%) การโตส่วนใหญ่มาจากการเปิดร้านใหม่ ~700 ร้านต่อปี ส่วนที่กัมพูชาร้านลดจาก 125 เหลือ 39 ร้านใน 9 เดือน", r:"119,121,147"}
  ],
  price:{close:43.75, lo:41.0, hi:54.5, pe:"14.1", mcap:"3.9 แสนล้านบาท",
    note:"ราคาปิด 30 ต.ค. 2569 อยู่ค่อนไปทางล่างของกรอบ 1 ปี และต่ำกว่าราคาสิ้นปี 2562 (72.25 บาท) แต่ “ถูกหรือแพง” ต้องเทียบกับหุ้นอื่นในกลุ่มเดียวกัน ซึ่งหน้านี้ยังไม่ได้เทียบ จึงไม่สรุปว่าน่าซื้อ", r:"148,149,150,153"},
  gloss:[
    {k:"ปันผล", v:"ส่วนของกำไรที่บริษัทแบ่งคืนให้เจ้าของหุ้นเป็นเงินสด"},
    {k:"P/E", v:"ราคาหุ้น ÷ กำไรต่อหุ้น บอกว่าจ่ายกี่ปีของกำไรจึงได้เป็นเจ้าของ"},
    {k:"เงินสดจากการดำเนินงาน", v:"เงินที่เข้ากระเป๋าจริงจากการขายของ ต่างจากกำไรในบัญชี"},
    {k:"ค่าความนิยม", v:"ส่วนที่จ่ายเกินราคาบัญชีเมื่อซื้อกิจการ เป็นสินทรัพย์ที่อาจถูกตัดได้"},
    {k:"ยอดขายสาขาเดิม", v:"ยอดขายร้านที่เปิดมานานแล้ว วัดว่าโตจริง ไม่ใช่แค่เปิดร้านเพิ่ม"}
  ],
  sources:"<b>ที่มา:</b> งบการเงินปี 2568 (ผู้สอบบัญชี KPMG ความเห็นไม่มีเงื่อนไข) · งบไตรมาส 2/2569 (สอบทาน ไม่ใช่ตรวจสอบ) · MD&amp;A ปี 2568 และไตรมาส 2/2569 · แบบ 56-1 ปี 2568 · ราคาและมูลค่าตลาดจาก Yahoo Finance (แหล่งรอง ดึง 31 ต.ค. 2569 <i>ยังไม่ยืนยันกับ set.or.th</i>) · เลขใน [ ] คือเลขแถวใน <i>output/data.csv</i> ซึ่งระบุเอกสาร ตำแหน่ง และวันที่ของตัวเลขนั้น · ตัวเลขที่ระบุว่า “คำนวณ” ผู้จัดทำคำนวณเองจากตัวเลขในงบ · สีไฟสัญญาณเป็นความเห็นของผู้จัดทำ ไม่ใช่มาตรฐานทางบัญชี<br><b>ข้อจำกัด:</b> เอกสารนี้สรุปเพื่อการเรียนรู้ ไม่ใช่คำแนะนำการลงทุน ผู้จัดทำไม่ใช่ผู้ให้คำแนะนำที่ได้รับใบอนุญาต"
};

/* ===== TEMPLATE ===== */
const R = r => `<span class="ref">[${r}]</span>`;
const bar = arr => `<div class="bar">${arr.map(x=>`<i class="${x.c}" style="width:${x.p}%">${x.p}%</i>`).join("")}</div>`;
const pos = (D.price.close-D.price.lo)/(D.price.hi-D.price.lo)*100;
document.getElementById("page").innerHTML = `
<header class="head">
  <div><div class="tk">${D.ticker} · ${D.company} · สรุปหุ้น 1 หน้า อ่านใน 3 นาที</div>
  <h1>${D.headline}</h1>
  <div style="font-size:9.4pt;color:var(--mute);margin-top:.8mm">${D.sub} ${R(D.subRef)}</div></div>
  <div class="asof">${D.asof}</div>
</header>

<section class="stats">${D.stats.map(s=>`<div class="stat"><b>${s.v}</b><span>${s.l} ${R(s.r)}</span></div>`).join("")}</section>

<section>
  <h2>① เงินเข้ามาจากไหน (ปี 2568)</h2>
  <div class="bars">
    <div class="barrow"><div class="lab">สัดส่วนยอดขาย</div>${bar(D.revenue)}</div>
    <div class="barrow"><div class="lab">สัดส่วนกำไร (ก่อนดอกเบี้ยและภาษี)</div>${bar(D.profit)}</div>
  </div>
  <div class="legend"><span class="l1">${D.revenue[0].t}</span><span class="l2">${D.revenue[1].t}</span><span class="l3">${D.revenue[2].t}</span></div>
  <p class="insight">${D.insight} ${R(D.insightRef)}</p>
</section>

<section>
  <h2>② สุขภาพบริษัท 4 ด้าน</h2>
  <div class="lights">${D.lights.map(l=>`
    <div class="light"><div class="dot ${l.c}"></div><div><h3>${l.n}<em>${l.s}</em></h3><p>${l.t} ${R(l.r)}</p></div></div>`).join("")}
  </div>
</section>

<section class="two">
  <div class="box risk"><h2>③ ความเสี่ยงที่ต้องรู้</h2>
    <ol>${D.risks.map(x=>`<li><b>${x.h}</b><br>${x.t} ${R(x.r)}</li>`).join("")}</ol></div>
  <div class="box price"><h2>④ ราคาตอนนี้ (บาท)</h2>
    <div class="gauge"><i style="left:${pos}%"></i><u style="left:${pos}%">${D.price.close.toFixed(2)}</u></div>
    <div class="gl"><span>ต่ำสุด 1 ปี ${D.price.lo.toFixed(1)}</span><span>สูงสุด 1 ปี ${D.price.hi.toFixed(1)}</span></div>
    <div class="kv"><span>P/E (คำนวณ) <b>${D.price.pe} เท่า</b></span><span>มูลค่าตลาด <b>${D.price.mcap}</b></span></div>
    <p>${D.price.note} ${R(D.price.r)}</p></div>
</section>

<section>
  <h2>⑤ ศัพท์ที่ต้องรู้</h2>
  <div class="gloss">${D.gloss.map(g=>`<div><b>${g.k}</b>${g.v}</div>`).join("")}</div>
</section>

<footer class="foot">${D.sources}</footer>`;
if(location.hash==='#shot1'){var s=document.createElement('style');s.textContent='.page{margin:0!important;box-shadow:none!important}body{background:#fff}';document.head.appendChild(s);}
</script>
</body>
</html>
